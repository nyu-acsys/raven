name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: raven-linux-x64
          - os: ubuntu-24.04-arm
            artifact: raven-linux-arm64
          - os: macos-13
            artifact: raven-darwin-x64
          - os: macos-14
            artifact: raven-darwin-arm64
          - os: windows-latest
            artifact: raven-win32-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml 5.1
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"

      # opam's "z3" package compiles all of Z3 from source, which is slow and
      # has no dedicated Windows build recipe. This job only builds the raven
      # binary (raven shells out to the z3 CLI at runtime; it doesn't link
      # the OCaml z3 library), so there's nothing here that needs a real z3
      # binary present -- just satisfy the opam dependency without building
      # it.
      #
      # `opam install z3 --fake` was tried first but rejected: --fake also
      # fakes z3's entire build-dependency cone (ocamlfind, zarith, conf-c++,
      # conf-python-3) in one shot, which silently "installs" a
      # non-functional ocamlfind and breaks every later opam build in the
      # same switch. Pinning z3 to a trivial local package with no
      # dependencies and a no-op install avoids that: opam only ever
      # considers actions for z3 itself.
      - name: Satisfy opam's z3 dependency without building from source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh api repos/Z3Prover/z3/releases/latest --jq .tag_name | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          pin_dir="$RUNNER_TEMP/z3-opam-pin"
          mkdir -p "$pin_dir"
          cat > "$pin_dir/opam" <<EOF
          opam-version: "2.0"
          name: "z3"
          version: "$version"
          maintainer: "n/a"
          authors: "n/a"
          license: "MIT"
          homepage: "https://github.com/Z3prover/z3"
          bug-reports: "https://github.com/Z3prover/z3/issues"
          synopsis: "Stand-in for z3: this job never invokes z3, it only needs the opam dependency satisfied"
          build: []
          install: []
          EOF
          opam pin add -y z3 "$pin_dir"

      - run: opam install . --deps-only

      - run: opam exec -- dune build bin/raven.exe

      - name: Strip binary
        if: matrix.os != 'windows-latest'
        run: strip _build/default/bin/raven.exe

      - name: Stage binary (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp _build/default/bin/raven.exe dist/raven

      - name: Stage binary (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp _build/default/bin/raven.exe dist/raven.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release archives
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            tar -C "$dir" -czf "release/${name}.tar.gz" .
          done
          ls -la release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
          fail_on_unmatched_files: true
