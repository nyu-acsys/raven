name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: raven-linux-x64
          - os: ubuntu-24.04-arm
            artifact: raven-linux-arm64
          - os: macos-15-intel
            artifact: raven-darwin-x64
          - os: macos-14
            artifact: raven-darwin-arm64
          - os: windows-latest
            artifact: raven-win32-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml 5.1
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1"

      # opam's "z3" package compiles all of Z3 from source, which is slow and
      # has no dedicated Windows build recipe. This job only builds the raven
      # binary (raven shells out to the z3 CLI at runtime; it doesn't link
      # the OCaml z3 library), so there's nothing here that needs a real z3
      # binary present -- just satisfy the opam dependency without building
      # it.
      #
      # `opam install z3 --fake` was tried first but rejected: --fake also
      # fakes z3's entire build-dependency cone (ocamlfind, zarith, conf-c++,
      # conf-python-3) in one shot, which silently "installs" a
      # non-functional ocamlfind and breaks every later opam build in the
      # same switch. Pinning z3 to a trivial local package with no
      # dependencies and a no-op install avoids that: opam only ever
      # considers actions for z3 itself.
      - name: Satisfy opam's z3 dependency without building from source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh api repos/Z3Prover/z3/releases/latest --jq .tag_name | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          pin_dir="$RUNNER_TEMP/z3-opam-pin"
          mkdir -p "$pin_dir"
          cat > "$pin_dir/opam" <<EOF
          opam-version: "2.0"
          name: "z3"
          version: "$version"
          maintainer: "n/a"
          authors: "n/a"
          license: "MIT"
          homepage: "https://github.com/Z3prover/z3"
          bug-reports: "https://github.com/Z3prover/z3/issues"
          synopsis: "Stand-in for z3: this job never invokes z3, it only needs the opam dependency satisfied"
          build: []
          install: []
          EOF
          opam pin add -y z3 "$pin_dir"

      - run: opam install . --deps-only

      - run: opam exec -- dune build bin/raven.exe

      # Strip the staged copy rather than dune's own artifact: dune leaves everything
      # under _build read-only, and `strip` needs to write its target (it rewrites via a
      # temporary copy alongside it), so stripping in place fails with "unable to copy
      # file ... Permission denied". The copy in dist/ is writable, and is what actually
      # gets packaged.
      - name: Stage and strip binary (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp _build/default/bin/raven.exe dist/raven
          chmod u+w dist/raven
          strip dist/raven

      - name: Stage binary (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp _build/default/bin/raven.exe dist/raven.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release archives
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            tar -C "$dir" -czf "release/${name}.tar.gz" .
          done
          ls -la release

      # What this release is, in a form a client can read without downloading a binary
      # first. The VS Code extension fetches it to decide whether it can drive this
      # build (`lsp_protocol`) and whether the z3 it ships with is new enough
      # (`min_z3`) -- both before spending the download. It comes out of the binary
      # rather than being written out here, so there is one source of truth.
      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          # Artifact upload does not preserve the executable bit.
          chmod +x artifacts/raven-linux-x64/raven
          artifacts/raven-linux-x64/raven --manifest > release/manifest.json
          cat release/manifest.json
          # A tag that disagrees with the version compiled into the binary would leave
          # clients resolving a release whose contents announce themselves as something
          # else. Cheaper to catch here than after publishing.
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            manifest_version=$(sed -n 's/.*"version":"\([^"]*\)".*/\1/p' release/manifest.json)
            if [ "v${manifest_version}" != "${{ github.ref_name }}" ]; then
              echo "Tag ${{ github.ref_name }} does not match the version in the binary (${manifest_version})." >&2
              echo "Update Config.version in lib/config/config.ml, or retag." >&2
              exit 1
            fi
          fi

      # Lets a client verify what it downloaded. Covers the archives only: the manifest
      # and this file are fetched over the same HTTPS connection from the same release,
      # so checksumming them here would prove nothing.
      - name: Checksum release archives
        working-directory: release
        run: sha256sum *.tar.gz | tee SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/manifest.json
            release/SHA256SUMS
          fail_on_unmatched_files: true
