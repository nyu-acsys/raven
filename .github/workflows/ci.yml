name: Builds, tests & co

on:
  pull_request:
  push:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            z3_glob: "*arm64-osx*.zip"
            ocaml-compiler: "5.1"
          - os: ubuntu-latest
            z3_glob: "*x64-glibc*.zip"
            ocaml-compiler: "5.1"
          - os: windows-latest
            z3_glob: "*x64-win.zip"
            ocaml-compiler: "5.1"

    runs-on: ${{ matrix.os }}
    # Windows support is still stabilizing; don't let it block CI yet (mirrors release.yml).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      # opam's "z3" package compiles all of Z3 from source, which is slow and
      # has no dedicated Windows build recipe. Raven only ever shells out to
      # the z3 CLI (it doesn't link the OCaml z3 library), so grab a prebuilt
      # release binary and put it on PATH instead.
      - name: Download prebuilt Z3
        id: z3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir z3dl
          gh release download --repo Z3Prover/z3 --pattern "${{ matrix.z3_glob }}" --dir z3dl
          cd z3dl
          zipfile=$(ls *.zip)
          unzip -q "$zipfile"
          dir=$(unzip -Z1 "$zipfile" | head -1 | cut -d/ -f1)
          bin_dir="$PWD/$dir/bin"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            # Git Bash's $PWD is an MSYS-style path (/d/...). GITHUB_PATH is
            # read by later non-bash steps and, at runtime, by raven's own
            # Win32 SearchPath call -- neither understands MSYS paths, so
            # convert to a native Windows path before publishing it.
            bin_dir=$(cygpath -w "$bin_dir")
          fi
          echo "$bin_dir" >> "$GITHUB_PATH"
          export PATH="$PWD/$dir/bin:$PATH"
          version=$(z3 --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # Satisfy the opam "z3" dependency without triggering its from-source
      # build -- the real binary is already on PATH from the step above, this
      # just makes opam consider the version constraint satisfied.
      #
      # `opam install z3 --fake` was tried first but rejected: --fake also
      # fakes z3's entire build-dependency cone (ocamlfind, zarith, conf-c++,
      # conf-python-3) in one shot, which silently "installs" a
      # non-functional ocamlfind and breaks every later opam build in the
      # same switch. Pinning z3 to a trivial local package with no
      # dependencies and a no-op install avoids that: opam only ever
      # considers actions for z3 itself.
      - name: Satisfy opam's z3 dependency without building from source
        shell: bash
        run: |
          set -euo pipefail
          pin_dir="$RUNNER_TEMP/z3-opam-pin"
          mkdir -p "$pin_dir"
          cat > "$pin_dir/opam" <<EOF
          opam-version: "2.0"
          name: "z3"
          version: "${{ steps.z3.outputs.version }}"
          maintainer: "n/a"
          authors: "n/a"
          license: "MIT"
          homepage: "https://github.com/Z3prover/z3"
          bug-reports: "https://github.com/Z3prover/z3/issues"
          synopsis: "Stand-in for z3: the real binary is already on PATH from the download step above"
          build: []
          install: []
          EOF
          opam pin add -y z3 "$pin_dir"

      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune build

      - run: opam exec -- dune runtest
